<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>Witte Baby Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- edge-to-edge under the Dynamic Island; safe-area padding does the rest -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nadine">
<meta name="format-detection" content="telephone=no">

<!-- iPhone 16 / 16 Pro / 16 Pro Max launch images (light and dark) -->
<link rel="apple-touch-startup-image" href="assets/splash-1206x2622-light.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)">
<link rel="apple-touch-startup-image" href="assets/splash-1206x2622-dark.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)">
<link rel="apple-touch-startup-image" href="assets/splash-1320x2868-light.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)">
<link rel="apple-touch-startup-image" href="assets/splash-1320x2868-dark.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)">
<link rel="apple-touch-startup-image" href="assets/splash-1179x2556-light.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)">
<link rel="apple-touch-startup-image" href="assets/splash-1179x2556-dark.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.6 10.4 12 3.8l8.4 6.6"/><path d="M5.6 9.4V19a1.4 1.4 0 0 0 1.4 1.4h3.2v-5.2h3.6v5.2H17a1.4 1.4 0 0 0 1.4-1.4V9.4"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M8 6.5h11M8 12h11M8 17.5h11"/><circle cx="4.2" cy="6.5" r="1.3"/><circle cx="4.2" cy="12" r="1.3"/><circle cx="4.2" cy="17.5" r="1.3"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M4 20V10.5M10 20V4.5M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-growth" viewBox="0 0 24 24"><path d="M3 16.5 8.5 11l3.5 3.5L20.5 6"/><path d="M15.5 6h5v5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M4 7h10M18.5 7H20M4 12h3M11 12h9M4 17h8M16.5 17H20"/><circle cx="16" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="14" cy="17" r="2.2"/></symbol>
  <symbol id="i-feed" viewBox="0 0 24 24"><path d="M14.6 3.9a4.6 4.6 0 0 1 1.9 6.6c-1.5 2.4-4 3-4 6.2a4 4 0 0 1-7.9.6"/><circle cx="7.4" cy="8.2" r="3.4"/><circle cx="12.4" cy="16.6" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-sleep" viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.4 3.9a8.6 8.6 0 1 0 10.6 10.3Z"/><path d="M15.5 4.2h3.6l-3.6 3.9h3.6"/></symbol>
  <symbol id="i-diaper" viewBox="0 0 24 24"><path d="M3.2 7.2h17.6v3.3c0 5-3.6 9-8 9.3h-1.6c-4.4-.3-8-4.3-8-9.3Z"/><path d="M8.6 8.4c.6 3.4 2.5 4.6 3.4 4.6s2.8-1.2 3.4-4.6"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24"><rect x="2.4" y="8.4" width="19.2" height="7.2" rx="2"/><path d="M7 8.4v3M11 8.4v4.2M15 8.4v3M19 8.4v4.2"/></symbol>
  <symbol id="i-bottle" viewBox="0 0 24 24"><path d="M9.4 3.6h5.2M10.2 6.3h3.6l1.4 2.4v9.9a2 2 0 0 1-2 2h-2.4a2 2 0 0 1-2-2V8.7Z"/><path d="M10.2 11.4h3.6M9.9 3.6l.3 2.7M14.1 3.6l-.3 2.7"/></symbol>
  <symbol id="i-pump" viewBox="0 0 24 24"><path d="M12 3.4c2.6 3 4.4 5.2 4.4 7.6a4.4 4.4 0 0 1-8.8 0c0-2.4 1.8-4.6 4.4-7.6Z"/><path d="M6 20.4h12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9.5 5v14M14.5 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8 19 12 7.5 19.2Z"/></symbol>
  <symbol id="i-switch" viewBox="0 0 24 24"><path d="M4 8.5h13M13.5 5 17 8.5 13.5 12"/><path d="M20 15.5H7M10.5 12 7 15.5 10.5 19"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.8 4.6 4.4L19 6.6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.2a4.2 4.2 0 0 1-.5-8.4 5.6 5.6 0 0 1 10.8-1.2A3.9 3.9 0 0 1 17 18.2Z"/><path d="m9.7 14 1.9 1.9 3.4-3.7"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 3.6v16.8" /><path d="M12 20.4a8.4 8.4 0 0 0 0-16.8Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15.5V4.2M8.4 7.6 12 4l3.6 3.6"/><path d="M5.5 12.8v5.6a1.8 1.8 0 0 0 1.8 1.8h9.4a1.8 1.8 0 0 0 1.8-1.8v-5.6"/></symbol>
</defs></svg>

<header class="topbar">
  <div class="topbar-inner">
    <div class="avatar" id="profile-avatar" aria-hidden="true">N</div>
    <div class="topbar-id">
      <h1 id="profile-name">Baby</h1>
      <p id="profile-age" class="muted"></p>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light or dark">
      <svg class="ico"><use href="#i-theme"/></svg>
    </button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" role="tablist">
  <button class="tab" data-route="home"     role="tab"><svg class="ico"><use href="#i-home"/></svg>Home</button>
  <button class="tab" data-route="log"      role="tab"><svg class="ico"><use href="#i-log"/></svg>Log</button>
  <button class="tab" data-route="stats"    role="tab"><svg class="ico"><use href="#i-stats"/></svg>Stats</button>
  <button class="tab" data-route="growth"   role="tab"><svg class="ico"><use href="#i-growth"/></svg>Growth</button>
  <button class="tab" data-route="settings" role="tab"><svg class="ico"><use href="#i-more"/></svg>More</button>
</nav>

<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tooltip" class="viz-tooltip" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
