<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>Witte Baby Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- edge-to-edge under the Dynamic Island; safe-area padding does the rest -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nadine">
<meta name="format-detection" content="telephone=no">

<!-- iPhone 16 / 16 Pro / 16 Pro Max launch images (light and dark) -->
<link rel="apple-touch-startup-image" href="assets/splash-1206x2622-light.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)">
<link rel="apple-touch-startup-image" href="assets/splash-1206x2622-dark.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)">
<link rel="apple-touch-startup-image" href="assets/splash-1320x2868-light.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)">
<link rel="apple-touch-startup-image" href="assets/splash-1320x2868-dark.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)">
<link rel="apple-touch-startup-image" href="assets/splash-1179x2556-light.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)">
<link rel="apple-touch-startup-image" href="assets/splash-1179x2556-dark.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div>
      <h1 id="profile-name">Baby</h1>
      <p id="profile-age" class="muted"></p>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" role="tablist">
  <button class="tab" data-route="home"   role="tab"><span class="tab-ico">🏠</span>Home</button>
  <button class="tab" data-route="log"    role="tab"><span class="tab-ico">📋</span>Log</button>
  <button class="tab" data-route="stats"  role="tab"><span class="tab-ico">📊</span>Stats</button>
  <button class="tab" data-route="growth" role="tab"><span class="tab-ico">📈</span>Growth</button>
  <button class="tab" data-route="settings" role="tab"><span class="tab-ico">⚙️</span>More</button>
</nav>

<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tooltip" class="viz-tooltip" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
